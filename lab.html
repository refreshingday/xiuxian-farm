<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0d1224">
<title>素材实验场 · 灵田问道</title>
<style>
  :root { --ink: #f4efe2; --dim: rgba(244, 239, 226, .62); --line: rgba(214, 182, 112, .5); --gold: #e8c25a; --panel: linear-gradient(180deg, rgba(22, 38, 36, .82), rgba(14, 22, 24, .86)); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; -webkit-tap-highlight-color: transparent; background: #0d1224; font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif; color: var(--ink); user-select: none; }
  #app canvas { display: block; touch-action: none; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; backdrop-filter: blur(6px); padding: 8px 10px; box-shadow: inset 0 0 0 3px rgba(0,0,0,.25), inset 0 0 0 4px rgba(214,182,112,.18), 0 4px 14px rgba(0,0,0,.25); }
  button { font: inherit; color: var(--ink); background: rgba(255,255,255,.06); border: 1px solid rgba(214,182,112,.28); border-radius: 4px; padding: 4px 9px; cursor: pointer; white-space: nowrap; }
  button:hover { background: rgba(232,194,90,.16); }
  button.on { background: rgba(232,194,90,.3); border-color: var(--gold); color: #fff6d8; }
  kbd { font: 10px monospace; opacity: .6; margin-right: 4px; }
  #top { position: fixed; left: 12px; top: 12px; right: 12px; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
  #top > * { pointer-events: auto; }
  #title { font-family: "STKaiti", "KaiTi", serif; font-size: 24px; letter-spacing: 2px; text-shadow: 0 2px 6px rgba(0,0,0,.6); }
  #title small { font-family: "Microsoft YaHei", sans-serif; font-size: 12px; letter-spacing: 0; color: var(--dim); margin-left: 8px; }
  #biomes { display: flex; flex-wrap: wrap; gap: 5px; max-width: 760px; }
  #biomes button { background: rgba(14, 22, 24, .62); backdrop-filter: blur(4px); }
  #biomes button.on { background: rgba(120, 92, 30, .85); }
  #side { position: fixed; right: 12px; top: 12px; width: 214px; display: flex; flex-direction: column; gap: 8px; font-size: 12px; }
  #side .row { display: flex; flex-wrap: wrap; gap: 4px; }
  #side label { display: flex; justify-content: space-between; color: var(--dim); margin-top: 2px; }
  #side input[type=range] { width: 100%; accent-color: var(--gold); }
  #side h4 { margin: 0 0 4px; font-size: 12px; color: var(--gold); font-weight: normal; letter-spacing: 1px; }
  #stats { position: fixed; left: 12px; bottom: 12px; font: 12px monospace; color: var(--dim); text-shadow: 0 1px 3px #000; }
  #help { position: fixed; right: 12px; bottom: 12px; font-size: 11px; color: var(--dim); text-align: right; line-height: 1.6; text-shadow: 0 1px 3px #000; }
  #labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .lbl { position: absolute; left: 0; top: 0; white-space: nowrap; will-change: transform; }
  .lbl.row { font-size: 13px; color: #3a2a1a; font-weight: bold; transform-origin: 0 0; margin: -10px 0 0 0; background: rgba(255, 248, 228, .85); border: 1px solid rgba(120, 90, 40, .4); border-radius: 3px; padding: 1px 6px; }
  .lbl.row i { font-style: normal; font-weight: normal; opacity: .6; font-size: 11px; }
  .lbl.var { font: 11px monospace; color: #fff; background: rgba(20, 24, 30, .6); border-radius: 8px; padding: 0 5px; margin: -8px 0 0 -8px; }
  body.clean #top, body.clean #side, body.clean #help, body.clean #labels { display: none; }
  #loading { position: fixed; inset: 0; display: flex; flex-direction: column; gap: 14px; align-items: center; justify-content: center; background: #0d1224; z-index: 20; padding: 24px; text-align: center; }
  #loading b { font-family: "STKaiti", "KaiTi", serif; font-size: 26px; letter-spacing: 4px; font-weight: normal; }
  #loading .step { font-size: 13px; color: var(--dim); min-height: 1.4em; }
  #loading .err { font: 12px/1.5 monospace; color: #ff9a8a; max-width: 92vw; white-space: pre-wrap; word-break: break-word; }
  #loading .bar { width: 180px; height: 3px; background: rgba(255,255,255,.1); border-radius: 2px; overflow: hidden; }
  #loading .bar i { display: block; height: 100%; width: 0; background: var(--gold); transition: width .25s; }
  #busy { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); padding: 8px 16px; font-size: 13px; z-index: 15; display: none; }
  body.busy #busy { display: block; }
  #gear { display: none; }
  /* ---------- 手机 / 竖屏 ---------- */
  body.mobile #top { left: 8px; right: 8px; top: max(8px, env(safe-area-inset-top)); gap: 6px; }
  body.mobile #title { font-size: 18px; }
  body.mobile #title small { display: block; margin: 2px 0 0; font-size: 11px; }
  body.mobile #biomes { flex-wrap: nowrap; overflow-x: auto; max-width: none; padding-bottom: 2px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  body.mobile #biomes::-webkit-scrollbar { display: none; }
  body.mobile #biomes button { padding: 7px 11px; font-size: 13px; flex: none; }
  body.mobile kbd, body.mobile #help { display: none; }
  body.mobile #gear { display: block; position: fixed; right: 10px; bottom: max(10px, env(safe-area-inset-bottom)); z-index: 12; padding: 10px 14px; font-size: 14px; background: rgba(22, 38, 36, .9); border-color: var(--gold); }
  body.mobile #side { top: auto; left: 8px; right: 8px; width: auto; bottom: calc(max(10px, env(safe-area-inset-bottom)) + 52px); max-height: 58vh; overflow-y: auto; z-index: 11; transform: translateY(calc(100% + 80px)); transition: transform .25s; }
  body.mobile.panel-open #side { transform: none; }
  body.mobile #side button { padding: 8px 10px; font-size: 13px; }
  body.mobile #side input[type=range] { height: 28px; }
  body.mobile #stats { bottom: calc(max(10px, env(safe-area-inset-bottom)) + 52px); left: auto; right: 10px; font-size: 10px; max-width: 55vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: right; }
  body.mobile .lbl.row { font-size: 11px; }
  body.mobile .lbl.var { font-size: 9px; }
  body.clean #gear { opacity: .35; }
  /* 虚拟摇杆（与主游戏 index.html 同款，touch.js 创建元素） */
  #stickZone, #stick { display: none; }
  body.mobile #stickZone { display: block; position: fixed; left: 0; bottom: 0; width: 45vw; height: 55vh; z-index: 3; touch-action: none; }
  body.mobile #stick { display: block; position: fixed; left: calc(90px + env(safe-area-inset-left)); top: calc(100% - 120px - env(safe-area-inset-bottom)); width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; background: rgba(14, 22, 24, .35); border: 2px solid rgba(214, 182, 112, .4); pointer-events: none; z-index: 3; opacity: .55; transition: opacity .15s; }
  body.mobile #stick.live { opacity: 1; }
  #stick i { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, rgba(255, 240, 200, .8), rgba(214, 182, 112, .55)); box-shadow: 0 2px 8px rgba(0,0,0,.5); }
  body.noWalk #stickZone, body.noWalk #stick, body.clean #stick { display: none !important; }
</style>
<!-- 加载失败时把原因显示在加载画面上，而不是一直转圈 -->
<script>
  (function () {
    var t0 = Date.now();
    function el(sel) { return document.querySelector('#loading ' + sel); }
    window.labStatus = function (text, pct) {
      var s = el('.step'); if (s) s.textContent = text;
      var b = el('.bar i'); if (b && pct != null) b.style.width = pct + '%';
    };
    window.labFail = function (msg) {
      var e = el('.err'); if (!e) return;
      e.textContent += (e.textContent ? '\n' : '') + msg;
      var s = el('.step'); if (s) s.textContent = '加载出错（截图发给开发者）';
    };
    addEventListener('error', function (e) {
      if (e.target && e.target !== window && (e.target.src || e.target.href)) labFail('资源加载失败: ' + (e.target.src || e.target.href));
      else labFail((e.message || 'Error') + (e.filename ? '\n@ ' + e.filename.split('/').slice(-2).join('/') + ':' + e.lineno : ''));
    }, true);
    addEventListener('unhandledrejection', function (e) { labFail(String(e.reason && (e.reason.stack || e.reason.message) || e.reason)); });
    setTimeout(function () {
      if (document.getElementById('loading') && !el('.err').textContent) labStatus('仍在加载… 已等待 ' + Math.round((Date.now() - t0) / 1000) + ' 秒（网络慢或浏览器不支持 WebGL/ES 模块）');
    }, 15000);
  })();
</script>
<!-- 旧版浏览器（iOS 16.3 及以下等）不支持 importmap：用 es-module-shims 补上 -->
<script async src="vendor/es-module-shims.js"></script>
<script type="importmap">
{ "imports": {
  "three": "./vendor/three@0.160.0/build/three.module.min.js",
  "three/addons/": "./vendor/three@0.160.0/jsm/",
  "./src/util.js": "./src/util.js?v=20261028c",
  "./src/chibi.js": "./src/chibi.js?v=20261028c",
  "./src/touch.js": "./src/touch.js?v=20261028c",
  "./src/lab/kit.js": "./src/lab/kit.js?v=20261028c",
  "./src/lab/assets.js": "./src/lab/assets.js?v=20261028c",
  "./src/lab/biomes.js": "./src/lab/biomes.js?v=20261028c"
} }
</script>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="top">
  <div id="title"></div>
  <div id="biomes"></div>
</div>

<div id="side">
  <div class="panel">
    <h4>模式</h4>
    <div class="row" id="modes">
      <button data-m="scene">场景</button><button data-m="catalog">图鉴</button><button data-m="all">全部素材</button>
    </div>
  </div>
  <div class="panel">
    <h4>画面</h4>
    <div class="row">
      <button data-t="outline">描边</button><button data-t="shadows">阴影</button><button data-t="bloom">泛光</button>
      <button data-t="grade">调色</button><button data-t="particles">粒子</button>
      <button data-t="chibi">角色</button><button data-t="labels">标签</button><button data-t="spin">自转</button>
    </div>
    <label>时间 <b id="timeV"></b></label>
    <input id="time" type="range" min="0" max="24" step="0.05">
    <label>泛光强度 <span><b id="bloomV"></b> <button id="bloomReset" style="padding:0 6px;font-size:11px">默认</button></span></label>
    <input id="bloomS" type="range" min="0" max="2" step="0.05">
    <label>泛光阈值 <span><b id="bloomTV"></b> <button id="bloomTReset" style="padding:0 6px;font-size:11px">默认</button></span></label>
    <input id="bloomT" type="range" min="0" max="1.5" step="0.05">
    <label>风力</label>
    <input id="wind" type="range" min="0" max="3" step="0.05" value="1">
    <label>描边粗细</label>
    <input id="line" type="range" min="0" max="2.5" step="0.05" value="1">
  </div>
  <div class="panel row">
    <button id="reseed">重新撒点</button><button id="shot">截图</button><button id="hideui">隐藏界面</button>
  </div>
</div>

<div id="stats"></div>
<div id="help">
  拖动旋转 · 右键平移 · 滚轮缩放<br>
  <b>WASD</b> 走路 · <b>1–9 0</b> 切换区域 · <b>C</b> 场景/图鉴 · <b>R</b> 重新撒点<br>
  <b>O</b> 描边 · <b>H</b> 隐藏界面<br>
  <a href="index.html" style="color:var(--gold)">← 返回游戏</a>
</div>
<div id="loading"><b>素材实验场</b><div class="bar"><i></i></div><div class="step">加载脚本…</div><div class="err"></div></div>
<div id="busy" class="panel">生成中…</div>
<button id="gear">⚙ 设置</button>

<!-- 改了实验场代码就改 v，避免浏览器拿旧缓存（上面 importmap 里的版本号一起改） -->
<script type="module" src="src/lab/lab.js?v=20261028c"></script>
</body>
</html>
