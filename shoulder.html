<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>主角站姿预览 · 灵田问道</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1b2433; font-family: "Microsoft YaHei", sans-serif; color: #f4efe2; }
  canvas { display: block; position: fixed; left: 0; top: 0; }
  .lab { position: fixed; top: 10px; font-size: 14px; padding: 3px 10px; background: rgba(14,22,24,.7); border: 1px solid rgba(214,182,112,.4); border-radius: 4px; pointer-events: none; }
  #l1 { left: 12px; } #l2 { left: calc(50% + 12px); }
  #mid { position: fixed; left: 50%; top: 0; bottom: 0; width: 2px; background: rgba(214,182,112,.5); }
  #ui { position: fixed; left: 12px; bottom: 12px; right: 12px; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font-size: 13px; background: rgba(14,22,24,.75); padding: 8px 12px; border-radius: 6px; }
  #ui label { display: flex; align-items: center; gap: 5px; }
  #ui input[type=range] { width: 110px; }
  button { font: inherit; color: #f4efe2; background: rgba(14,22,24,.7); border: 1px solid rgba(214,182,112,.4); border-radius: 4px; padding: 3px 10px; cursor: pointer; }
  button.on { background: rgba(120,92,30,.9); border-color: #e8c25a; }
  .guide { position: fixed; left: 0; width: 50%; height: 0; border-top: 1px dashed rgba(255,90,90,.7); pointer-events: none; display: none; }
</style>
</head>
<body>
<div id="mid"></div>
<div class="lab" id="l1">正面（站姿）</div>
<div class="lab" id="l2">游戏视角</div>
<div class="guide" id="g1"></div>
<div id="ui">
  <button id="bFix" class="on">方肩修正：开</button>
  <button id="bW" class="on">肩头权重：开</button>
  <button id="bGuide">肩线辅助</button>
  <label>游戏镜头距离 <input id="rDist" type="range" min="6" max="21" step="0.5" value="9"><span id="vDist">9</span>（游戏里是 21）</label>
  <label>转身 <input id="rYaw" type="range" min="-3.14" max="3.14" step="0.05" value="0"></label>
  <label>权重范围 <input id="wr" type="range" min="0.01" max="0.12" step="0.005"><span></span></label>
  <label>权重高度 <input id="wt" type="range" min="-0.08" max="0.03" step="0.005"><span></span></label>
  <label>肩头抬高 <input id="wl" type="range" min="0" max="0.05" step="0.0025"><span></span></label>
  <label>down <input id="sd" type="range" min="0" max="0.8" step="0.01"><span></span></label>
  <label>back <input id="sb" type="range" min="0" max="0.5" step="0.01"><span></span></label>
  <label>minOut <input id="sm" type="range" min="0" max="0.9" step="0.01"><span></span></label>
</div>
<script async src="vendor/es-module-shims.js"></script>
<script type="importmap">
{ "imports": {
  "three": "./vendor/three@0.160.0/build/three.module.min.js",
  "three/addons/": "./vendor/three@0.160.0/jsm/"
} }
</script>
<script type="module" src="src/shoulder_preview.js"></script>
<script type="module" src="src/version.js"></script>
</body>
</html>
